name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint journal v0.3 changes
        run: >-
          ruff check
          src/turkiye_grid_fm/journal_metrics.py
          tests/test_journal_metrics.py
          scripts/fetch_exploratory_history.py
          scripts/audit_exploratory_history.py
          scripts/run_journal_baselines.py
      - name: Tests
        run: pytest
      - name: Smoke train
        run: python scripts/train_smoke.py
